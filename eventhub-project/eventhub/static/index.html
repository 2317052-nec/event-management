<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EventHub – Discover. Register. Experience.</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f5f6fb;
            --cd: #fff;
            --tx: #0f172a;
            --mu: #64748b;
            --p: #3730a3;
            --p2: #4338ca;
            --soft: #e0e7ff;
            --ln: #e2e8f0;
            --ok: #16a34a;
            --wa: #ea580c;
            --er: #dc2626
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0b1020;
                --cd: #141b34;
                --tx: #e8ebf7;
                --mu: #94a3b8;
                --p: #a5b4fc;
                --p2: #4f46e5;
                --soft: #252d63;
                --ln: #263056
            }
        }

        :root[data-theme=dark] {
            --bg: #0b1020;
            --cd: #141b34;
            --tx: #e8ebf7;
            --mu: #94a3b8;
            --p: #a5b4fc;
            --p2: #4f46e5;
            --soft: #252d63;
            --ln: #263056
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--tx);
            line-height: 1.55
        }

        h1,
        h2,
        h3 {
            margin: 0;
            line-height: 1.15;
            letter-spacing: -.02em
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            font-weight: 800
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 800
        }

        h3 {
            font-size: 1.05rem
        }

        p {
            margin: .3rem 0
        }

        .w {
            max-width: 1160px;
            margin: auto;
            padding: 0 20px
        }

        .sec {
            padding: 44px 0
        }

        .mu {
            color: var(--mu)
        }

        .ok {
            color: var(--ok)
        }

        .er {
            color: var(--er)
        }

        .wa {
            color: var(--wa)
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        :focus-visible {
            outline: 3px solid #818cf8;
            outline-offset: 2px
        }

        nav {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 20;
            background: var(--cd);
            border-bottom: 1px solid var(--ln)
        }

        .nv {
            display: flex;
            align-items: center;
            gap: 20px;
            height: 64px
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--p);
            text-decoration: none;
            letter-spacing: .02em
        }

        .lk {
            display: flex;
            gap: 6px;
            flex: 1
        }

        .lk a,
        .lk button.l {
            color: var(--tx);
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: .92rem;
            background: none;
            border: 0;
            cursor: pointer
        }

        .lk a:hover {
            background: var(--soft)
        }

        .rt {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .bg {
            display: none;
            background: none;
            border: 0;
            font-size: 1.5rem;
            cursor: pointer
        }

        .btn {
            background: var(--p2);
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .15s;
            text-decoration: none;
            display: inline-block
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.12)
        }

        .btn.o {
            background: transparent;
            color: var(--p);
            border: 1.5px solid var(--ln)
        }

        .btn.g {
            background: var(--ok)
        }

        .btn.r {
            background: var(--er)
        }

        .btn.sm {
            padding: 6px 10px;
            font-size: .82rem
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none
        }

        .hero {
            background: linear-gradient(135deg, #1e1b4b, #3730a3 60%, #4f46e5);
            color: #fff;
            padding: 56px 0 64px
        }

        .hero p {
            max-width: 560px;
            opacity: .9;
            font-size: 1.1rem
        }

        .hero .row {
            margin: 22px 0;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 12px
        }

        .sb {
            background: var(--cd);
            color: var(--tx);
            border-radius: 16px;
            padding: 14px;
            display: grid;
            grid-template-columns: 2fr 1.3fr 1.3fr 1.2fr auto;
            gap: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .25)
        }

        input,
        select,
        textarea {
            background: var(--cd);
            border: 1.5px solid var(--ln);
            border-radius: 10px;
            padding: 10px 12px;
            width: 100%
        }

        input[type=radio],
        input[type=checkbox] {
            width: auto
        }

        label {
            font-size: .85rem;
            font-weight: 600;
            display: block;
            margin-bottom: 10px
        }

        label input,
        label select {
            margin-top: 4px;
            font-weight: 400
        }

        .fe {
            color: var(--er);
            font-size: .8rem;
            font-weight: 400
        }

        .grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(3, 1fr)
        }

        @media(max-width:960px) {
            .grid {
                grid-template-columns: repeat(2, 1fr)
            }

            .sb {
                grid-template-columns: 1fr 1fr
            }
        }

        @media(max-width:700px) {

            .grid,
            .sb {
                grid-template-columns: 1fr
            }

            .lk {
                display: none;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: var(--cd);
                flex-direction: column;
                padding: 10px;
                border-bottom: 1px solid var(--ln)
            }

            .lk.open {
                display: flex
            }

            .bg {
                display: block
            }

            .rt .hd {
                display: none
            }
        }

        .card {
            background: var(--cd);
            border: 1px solid var(--ln);
            border-radius: 16px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, .05);
            transition: .2s;
            overflow: hidden
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(15, 23, 42, .12)
        }

        .pad {
            padding: 18px
        }

        .bn {
            height: 140px;
            position: relative;
            display: grid;
            place-items: center;
            overflow: hidden
        }

        .bn .em {
            font-size: 3.4rem;
            transition: .3s
        }

        .card:hover .em {
            transform: scale(1.15)
        }

        .bdg {
            position: absolute;
            left: 12px;
            top: 12px;
            background: rgba(255, 255, 255, .92);
            color: #312e81;
            border-radius: 99px;
            padding: 2px 10px;
            font-size: .75rem;
            font-weight: 700
        }

        .sv {
            position: absolute;
            right: 10px;
            top: 8px;
            background: rgba(255, 255, 255, .92);
            color: #be123c;
            border: 0;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1rem
        }

        .cb {
            padding: 16px;
            display: grid;
            gap: 8px
        }

        .meta {
            font-size: .86rem;
            color: var(--mu)
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px
        }

        .pr {
            font-size: 1.15rem;
            color: var(--p)
        }

        .cats {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px
        }

        @media(max-width:960px) {
            .cats {
                grid-template-columns: repeat(3, 1fr)
            }
        }

        @media(max-width:500px) {
            .cats {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        .cat {
            text-align: center;
            padding: 18px 8px;
            cursor: pointer;
            background: var(--cd);
            border: 1px solid var(--ln);
            border-radius: 16px;
            transition: .2s
        }

        .cat:hover {
            border-color: var(--p2);
            transform: translateY(-3px)
        }

        .cat b {
            display: block;
            font-size: .9rem
        }

        .cat span {
            font-size: 2rem
        }

        .pill {
            display: inline-block;
            background: var(--soft);
            color: var(--p);
            border-radius: 99px;
            padding: 2px 10px;
            font-size: .75rem;
            font-weight: 700
        }

        .pill.ok {
            background: #dcfce7;
            color: #15803d
        }

        .pill.wa {
            background: #ffedd5;
            color: #c2410c
        }

        .pill.er {
            background: #fee2e2;
            color: #b91c1c
        }

        .tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid var(--ln);
            margin: 18px 0;
            overflow-x: auto
        }

        .tabs button {
            background: none;
            border: 0;
            border-bottom: 3px solid transparent;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--mu);
            white-space: nowrap
        }

        .tabs button.on {
            color: var(--p);
            border-color: var(--p2)
        }

        .steps {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            flex-wrap: wrap
        }

        .st {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            border-radius: 10px;
            background: var(--cd);
            border: 1px solid var(--ln);
            font-size: .85rem;
            color: var(--mu)
        }

        .st.on {
            border-color: var(--p2);
            color: var(--p);
            font-weight: 700;
            background: var(--soft)
        }

        .st.dn {
            color: var(--ok)
        }

        .two {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px
        }

        .f2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 14px
        }

        @media(max-width:800px) {

            .two,
            .f2 {
                grid-template-columns: 1fr
            }
        }

        .opt {
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1.5px solid var(--ln);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer
        }

        .opt:has(input:checked) {
            border-color: var(--p2);
            background: var(--soft)
        }

        .dash {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 24px;
            padding: 28px 0
        }

        .side {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-self: start;
            position: sticky;
            top: 80px
        }

        .side button {
            text-align: left;
            background: none;
            border: 0;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: var(--mu)
        }

        .side button.on,
        .side button:hover {
            background: var(--soft);
            color: var(--p)
        }

        @media(max-width:800px) {
            .dash {
                grid-template-columns: 1fr
            }

            .side {
                flex-direction: row;
                overflow-x: auto;
                position: static
            }

            .side button {
                white-space: nowrap
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 14px;
            margin: 16px 0
        }

        .stat b {
            font-size: 1.7rem;
            display: block;
            color: var(--p)
        }

        .tw {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .88rem
        }

        th,
        td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--ln);
            white-space: nowrap
        }

        th {
            color: var(--mu);
            font-weight: 600
        }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 170px;
            padding-top: 10px
        }

        .bars div {
            flex: 1;
            background: linear-gradient(var(--p2), #818cf8);
            border-radius: 8px 8px 0 0;
            position: relative;
            min-height: 6px;
            transition: height .6s
        }

        .bars div i {
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            text-align: center;
            font-style: normal;
            font-size: .75rem
        }

        .hb {
            display: grid;
            grid-template-columns: 90px 1fr 40px;
            gap: 8px;
            align-items: center;
            margin: 8px 0;
            font-size: .85rem
        }

        .hb u {
            display: block;
            height: 10px;
            background: var(--p2);
            border-radius: 6px;
            text-decoration: none
        }

        .tk {
            display: grid;
            grid-template-columns: 1fr auto;
            max-width: 640px;
            margin: auto;
            background: var(--cd);
            border-radius: 20px;
            border: 1px solid var(--ln);
            box-shadow: 0 14px 40px rgba(55, 48, 163, .2);
            overflow: hidden
        }

        .tk .l {
            padding: 24px;
            border-right: 2px dashed var(--ln);
            position: relative
        }

        .tk .r {
            padding: 20px;
            text-align: center;
            background: var(--soft);
            display: grid;
            place-items: center
        }

        .tk svg {
            width: 140px;
            height: 140px;
            border-radius: 8px
        }

        @media(max-width:600px) {
            .tk {
                grid-template-columns: 1fr
            }

            .tk .l {
                border-right: 0;
                border-bottom: 2px dashed var(--ln)
            }
        }

        .scan {
            position: relative;
            display: inline-block
        }

        .scan.go:after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: #22c55e;
            box-shadow: 0 0 12px #22c55e;
            animation: sc 1s linear infinite
        }

        @keyframes sc {
            0% {
                top: 0
            }

            100% {
                top: 100%
            }
        }

        .sk {
            height: 300px;
            border-radius: 16px;
            background: linear-gradient(90deg, var(--ln), var(--soft), var(--ln));
            background-size: 200% 100%;
            animation: sh 1.2s infinite
        }

        @keyframes sh {
            to {
                background-position: -200% 0
            }
        }

        .fade {
            animation: fd .3s ease
        }

        @keyframes fd {
            from {
                opacity: 0
            }
        }

        .pop {
            animation: pp .5s cubic-bezier(.3, 1.6, .5, 1)
        }

        @keyframes pp {
            from {
                transform: scale(.3);
                opacity: 0
            }
        }

        .big {
            font-size: 3.5rem;
            text-align: center
        }

        .emp {
            text-align: center;
            padding: 40px 20px
        }

        .emp .big {
            font-size: 3rem
        }

        .sticky {
            display: none
        }

        @media(max-width:700px) {
            .sticky {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 15;
                gap: 10px;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
                background: var(--cd);
                border-top: 1px solid var(--ln)
            }

            #ai {
                bottom: 84px !important
            }
        }

        #ai {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 30
        }

        #ai .fab {
            box-shadow: 0 8px 24px rgba(55, 48, 163, .4);
            border-radius: 99px;
            padding: 12px 18px
        }

        #cp {
            display: none;
            width: min(360px, calc(100vw - 32px));
            background: var(--cd);
            border: 1px solid var(--ln);
            border-radius: 16px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .25);
            margin-bottom: 10px;
            overflow: hidden
        }

        #cp.open {
            display: block
        }

        #cl {
            height: 280px;
            overflow: auto;
            padding: 12px;
            font-size: .88rem
        }

        #cl div {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--soft);
            max-width: 92%
        }

        #cl div.u {
            background: var(--p2);
            color: #fff;
            margin-left: auto
        }

        #toast {
            position: fixed;
            left: 50%;
            top: 80px;
            transform: translateX(-50%);
            background: #0f172a;
            color: #fff;
            padding: 10px 18px;
            border-radius: 99px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: .3s
        }

        #toast.on {
            opacity: 1
        }

        footer {
            background: #0f172a;
            color: #cbd5e1;
            padding: 40px 0 20px;
            margin-top: 40px
        }

        footer .grid {
            grid-template-columns: 2fr 1fr 1fr 1fr
        }

        @media(max-width:700px) {
            footer .grid {
                grid-template-columns: 1fr 1fr
            }
        }

        footer a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 3px 0;
            cursor: pointer
        }

        footer h3 {
            color: #fff
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }

        @media print {

            nav,
            footer,
            #ai,
            .noprint {
                display: none !important
            }
        }
    </style>
</head>

<body>
    <nav id="nav"></nav>
    <main id="app"></main>
    <footer id="ft"></footer>
    <div id="ai"></div>
    <div id="toast"></div>
